<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Testimoni Pelanggan • Yamzz Market</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/index.css">
<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:22px;
  font-family:Inter,system-ui,sans-serif;
  color:#f2f7ff;
  background:linear-gradient(145deg,#06111d,#0a1b2b);
}

.wrap{
  width:min(820px,100%);
  margin:auto;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#9eb8d0;
  text-decoration:none;
  font-size:12px;
  margin:10px 0 25px;
}

header{
  text-align:center;
  margin:10px 0 25px;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header p{
  margin:0;
  color:#91a8bd;
  font-size:13px;
}

/* SUMMARY */
.summary,
.testimonial-card{
  border:1px solid rgba(100,165,225,.14);
  border-radius:20px;
  background:linear-gradient(145deg,#15395d,#0b2034);
  box-shadow:0 18px 55px rgba(0,0,0,.18);
}

.summary{
  text-align:center;
  padding:22px;
  margin-bottom:20px;
}

.total{
  color:#91a8bd;
  font-size:12px;
}

/* TESTIMONI GRID */
#testimonialList{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

/* CARD */
.testimonial-card{
  padding:14px;
  background:rgba(18,42,65,.86);
  min-width:0;
  overflow:hidden;
}

/* TOP */
.top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:11px;
  overflow:hidden;
  flex:0 0 38px;
  background:#102b45;
  display:grid;
  place-items:center;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar i{
  color:#75baff;
  font-size:16px;
}

.name{
  font-size:12px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.date{
  margin-top:3px;
  color:#607b92;
  font-size:9px;
}

/* MESSAGE */
.message{
  margin:10px 0 8px;
  color:#d5e2ee;
  font-size:11px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

/* IMAGE TESTIMONI */
.proof{
  display:block;
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:10px;
  margin-top:8px;
  background:#07111f;
  border:1px solid rgba(255,255,255,.06);
}

/* STATE */
.state{
  grid-column:1 / -1;
  text-align:center;
  padding:35px;
  color:#91a8bd;
  font-size:13px;
}

.error{
  color:#ff9b9b;
}

/* TABLET */
@media(max-width:500px){
  body{
    padding:14px;
  }

  .wrap{
    width:100%;
  }

  header{
    margin:5px 0 18px;
  }

  header h1{
    font-size:23px;
  }

  header p{
    font-size:11px;
  }

  .summary{
    padding:16px;
    margin-bottom:14px;
    border-radius:16px;
  }

  #testimonialList{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .testimonial-card{
    padding:11px;
    border-radius:15px;
  }

  .avatar{
    width:32px;
    height:32px;
    flex-basis:32px;
    border-radius:9px;
  }

  .avatar i{
    font-size:14px;
  }

  .name{
    font-size:11px;
  }

  .date{
    font-size:8px;
  }

  .message{
    font-size:10px;
    line-height:1.5;
    margin:8px 0 6px;
  }

  .proof{
    max-height:170px;
    border-radius:8px;
  }
}

/* HP KECIL */
@media(max-width:360px){
  body{
    padding:10px;
  }

  #testimonialList{
    gap:6px;
  }

  .testimonial-card{
    padding:9px;
    border-radius:13px;
  }

  .avatar{
    width:29px;
    height:29px;
    flex-basis:29px;
  }

  .top{
    gap:6px;
  }

  .name{
    font-size:10px;
  }

  .date{
    font-size:7px;
  }

  .message{
    font-size:9px;
  }

  .proof{
    max-height:140px;
  }
}
</style>
</head>
<body>
  <!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="nav-container">


        <!-- BRAND -->

        <a href="index.html" class="brand">

            <div class="brand-logo">

                <img
                    id="navLogo"
                    src="assets/hero.png"
                    alt="Logo"
                >

            </div>


            <div class="brand-info">

                <strong id="navStoreName">
                    Yamzz Market
                </strong>

                <span>
                    JASTEB STORE
                </span>

            </div>

        </a>



        <!-- NAV ACTIONS -->

        <div class="nav-actions">

            <!-- WHATSAPP -->

            <a
                id="navWhatsapp"
                href="#"
                target="_blank"
                rel="noopener"
                class="nav-wa"
            >

                <i class="fa-brands fa-whatsapp"></i>

                <span>
                    WhatsApp
                </span>

            </a>

        </div>


    </div>

</header>




<!-- =========================================
     LIVE PAID TRANSACTIONS
========================================= -->

<section class="paid-transactions-section" aria-label="Transaksi berhasil terbaru">
    <div class="container">
        <div class="paid-live-card" id="paidTransactionsCard" hidden>
            <div class="paid-live-head">
                <div class="paid-live-title">
                    <span class="paid-live-dot"></span>
                    <div>
                        <strong>Transaksi Terbaru</strong>
                        <span>Aktivitas transaksi terbaru</span>
                    </div>
                </div>
                <span class="paid-live-status"><i class="fa-solid fa-bolt"></i> LIVE</span>
            </div>
            <div class="paid-live-track" id="paidTransactionsTrack" aria-live="polite">
                <div class="paid-live-item paid-live-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i> Memuat transaksi...
                </div>
            </div>
        </div>
<main class="wrap">
<header><h1><i class="fa-solid fa-comments"></i> Testimoni Pelanggan</h1><p>Pengalaman pelanggan Yamzz Market</p></header>
<section class="summary"><div id="total" class="total">Memuat testimoni...</div></section>
<section id="testimonialList"><div class="state">Memuat testimoni...</div></section>
</main>
<nav class="bottom-navbar" aria-label="Navigasi utama">
<a href="produk.html" data-page="produk"><i class="fa-solid fa-box"></i><span>Produk</span></a>
<a href="index.html" data-page="home"><i class="fa-solid fa-house"></i><span>Home</span></a>
<a href="cek-transaksi.html" data-page="trx"><i class="fa-solid fa-magnifying-glass"></i><span>Pesanan</span></a>
<a href="rating.html" data-page="rating"><i class="fa-solid fa-comments"></i><span>Testimoni</span></a>
<a href="tentang.html" data-page="tentang"><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
</nav>

  <script>

document.addEventListener(
    'DOMContentLoaded',
    () => {

        document
            .querySelectorAll('.bottom-navbar a')
            .forEach(a => {

                a.classList.toggle(
                    'active',
                    a.dataset.page === 'rating'
                );

            });

    }
);

  </script>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmtDate=v=>{if(!v)return "";try{return new Intl.DateTimeFormat("id-ID",{dateStyle:"medium"}).format(new Date(v))}catch{return ""}};
async function loadTestimonials(){
 const list=document.getElementById("testimonialList"),total=document.getElementById("total");
 try{
  const r=await fetch("/api/casaku/get-testimonials",{cache:"no-store"}),d=await r.json();
  if(!r.ok)throw new Error(d.error||"Gagal memuat testimoni.");
  const items=Array.isArray(d.testimonials)?d.testimonials:[];
  total.textContent=items.length?`${items.length} testimoni pelanggan`:"Belum ada testimoni";
  if(!items.length){list.innerHTML='<div class="state">Belum ada testimoni pelanggan.</div>';return}
  list.innerHTML=items.map(t=>`<article class="testimonial-card">
   <div class="top"><div class="avatar">${t.image?`<img src="${esc(t.image)}" alt="">`:`<i class="fa-solid fa-user"></i>`}</div><div><div class="name">${esc(t.name||"Pelanggan")}</div><div class="date">${esc(fmtDate(t.createdAt))}</div></div></div>
   <div class="message">${esc(t.message||"")}</div>
   ${t.image?`<img class="proof" src="${esc(t.image)}" alt="Gambar testimoni">`:""}
  </article>`).join("");
 }catch(e){console.error(e);list.innerHTML=`<div class="state error">${esc(e.message||"Gagal memuat testimoni.")}</div>`}
}
document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll(".bottom-navbar a").forEach(a=>{if(a.dataset.page==="rating")a.dataset.page="testimoni"});loadTestimonials()});
</script>
</body>
</html>
