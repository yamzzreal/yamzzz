<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Rating Pelanggan • Yamzz Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/index.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px;
      font-family: Inter, system-ui, sans-serif; color: #f2f7ff;
      background: linear-gradient(145deg, #06111d, #0a1b2b);
    }
    .wrap { width: min(820px, 100%); margin: auto; }
    .back { display: inline-flex; gap: 8px; color: #9eb8d0; text-decoration: none; font-size: 12px; margin: 10px 0 25px; }
    header { text-align: center; margin: 10px 0 25px; }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: #91a8bd; font-size: 13px; }
    .summary, .rating-card {
      border: 1px solid rgba(100,165,225,.14); border-radius: 20px;
      background: linear-gradient(145deg, #15395d, #0b2034);
      box-shadow: 0 18px 55px rgba(0,0,0,.18);
    }
    .summary { text-align: center; padding: 25px; margin-bottom: 20px; }
    .average { font-size: 44px; font-weight: 900; }
    .average-stars, .stars { color: #ffc107; letter-spacing: 2px; }
    .average-stars { font-size: 25px; margin: 4px 0; }
    .total { color: #91a8bd; font-size: 12px; }
    #ratingList { display: grid; gap: 14px; }
    .rating-card { padding: 19px; background: rgba(18,42,65,.86); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .name { font-size: 14px; font-weight: 800; }
    .stars { font-size: 15px; white-space: nowrap; }
    .comment { margin: 14px 0 10px; color: #d5e2ee; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
    .product, .date { color: #809bb3; font-size: 11px; }
    .date { margin-top: 7px; color: #607b92; }
    .state { text-align: center; padding: 35px; color: #91a8bd; font-size: 13px; }
    .error { color: #ff9b9b; }
    @media (max-width: 520px) { .top { align-items: flex-start; flex-direction: column; gap: 7px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke toko</a>
    <header>
      <h1>⭐ Rating Pelanggan</h1>
      <p>Pengalaman pelanggan Yamzz Market</p>
    </header>

    <section class="summary">
      <div id="average" class="average">0.0</div>
      <div id="averageStars" class="average-stars">☆☆☆☆☆</div>
      <div id="total" class="total">Belum ada rating</div>
    </section>

    <section id="ratingList"><div class="state">Memuat rating...</div></section>
  </main>

  <!-- =========================================
     BOTTOM NAVBAR
========================================= -->

<nav
    class="bottom-navbar"
    aria-label="Navigasi utama"
>


    <!-- PRODUK -->

    <a
        href="produk.html"
        data-page="produk"
    >

        <i class="fa-solid fa-box"></i>

        <span>
            Produk
        </span>

    </a>



    <!-- HOME -->

    <a
        href="index.html"
        data-page="home"
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>

    <a
        href="rating.html"
        data-page="rating"
    >

        <i class="fa-solid fa-star"></i>

        <span>
            Rating
        </span>

    </a>

    <!-- TENTANG -->

    <a
        href="tentang.html"
        data-page="tentang"
    >

        <i class="fa-solid fa-circle-info"></i>

        <span>
            Tentang
        </span>

    </a>

</nav>


  
  <script>
    const API = '/api/casaku/get-ratings';

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
    }

    function stars(value) {
      const n = Math.max(0, Math.min(5, Math.round(Number(value) || 0)));
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function dateText(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    async function loadRatings() {
      const list = document.getElementById('ratingList');
      try {
        const response = await fetch(API, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Gagal mengambil rating.');

        const ratings = Array.isArray(data.ratings) ? data.ratings : [];
        const total = ratings.length;
        const sum = ratings.reduce((acc, item) => acc + (Number(item.rating) || 0), 0);
        const average = total ? (sum / total).toFixed(1) : '0.0';

        document.getElementById('average').textContent = average;
        document.getElementById('averageStars').textContent = total ? stars(Math.round(Number(average))) : '☆☆☆☆☆';
        document.getElementById('total').textContent = total ? `${total} rating pelanggan` : 'Belum ada rating';

        if (!ratings.length) {
          list.innerHTML = '<div class="state">Belum ada rating pelanggan.</div>';
          return;
        }

        list.innerHTML = ratings.map(item => `
          <article class="rating-card">
            <div class="top">
              <div class="name">${esc(item.customerName || 'Pelanggan')}</div>
              <div class="stars">${stars(item.rating)}</div>
            </div>
            ${item.comment ? `<div class="comment">${esc(item.comment)}</div>` : ''}
            <div class="product">Produk: ${esc(item.product || 'Produk')}</div>
            <div class="date">${esc(dateText(item.createdAt))}</div>
          </article>
        `).join('');
      } catch (error) {
        console.error(error);
        list.innerHTML = `<div class="state error">Gagal memuat rating pelanggan.</div>`;
      }
    }

    loadRatings();
  </script>
</body>
</html>
